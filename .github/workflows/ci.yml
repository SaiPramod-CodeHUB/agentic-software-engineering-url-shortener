name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Unit, orchestration, integration and scenario tests
        run: mvn -B test
      - name: Javadoc (fails on any warning)
        run: mvn -B javadoc:javadoc
