spring.application.name=url-shortener

# Embedded, file-backed H2. Swapping databases means changing these four lines;
# the JPA repositories are the seam and contain no H2-specific code.
spring.datasource.url=jdbc:h2:file:./data/shortener;AUTO_SERVER=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Flyway owns the schema (versioned, reviewable); Hibernate only validates it.
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

shortener.base-url=http://localhost:8080
shortener.code-length=8
shortener.max-ttl-seconds=31536000
shortener.rate-limit.capacity=20
shortener.rate-limit.window-seconds=60
# Override in every real deployment (env var SHORTENER_VISITOR_HASH_KEY).
shortener.visitor-hash-key=${SHORTENER_VISITOR_HASH_KEY:local-dev-only-key}

# Alias/idempotency conflicts are expected control flow (409 / replay), handled in LinkService.
# Hibernate would log each one at ERROR, paging on-call for normal traffic; unexpected SQL
# failures still surface as exceptions and are logged by the web layer.
logging.level.org.hibernate.engine.jdbc.spi.SqlExceptionHelper=OFF
